# Clean checkout -> running service, the same image that is deployed:
#   docker compose up --build
#   ./burst.sh http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seatres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=seatres;Username=postgres;Password=postgres"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-admin}"
      DB_MAX_POOL_SIZE: "60"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_started  # the app retries until Postgres accepts connections
    restart: unless-stopped

volumes:
  pgdata:
